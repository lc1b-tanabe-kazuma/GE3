name: DebugBuild
on:
  push:
    branches:
      - master
env:
  SOLUTION_FILE_: project/CG2_DirectXGame.sln
  CONFIGURATION: Debug
jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
          
      - name: Build
          run: |
            msbuild ${{env.SOLUTION_FILW_PATH}} /p:platform=x64,configration=${{env.CONFIGRATION}]
